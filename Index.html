<!doctype html>
<html lang="en">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Private, approval-first coffee chat outreach assistant.">
    <style>
      :root {
        --clawpilot-bg: #f5f3ed;
        --clawpilot-surface: #fffdf8;
        --clawpilot-surface-alt: #ebe8df;
        --clawpilot-surface-strong: #16352d;
        --clawpilot-text: #183029;
        --clawpilot-text-inverse: #fffdf8;
        --clawpilot-muted: #66766f;
        --clawpilot-border: #d8ddd8;
        --clawpilot-accent: #ee6337;
        --clawpilot-accent-strong: #c84922;
        --clawpilot-accent-soft: #ffe8de;
        --clawpilot-positive: #1f7a55;
        --clawpilot-positive-soft: #e1f3ea;
        --clawpilot-warning: #9a6300;
        --clawpilot-warning-soft: #fff0c9;
        --clawpilot-danger: #b83b3b;
        --clawpilot-danger-soft: #fde7e7;
        --clawpilot-info: #2867b2;
        --clawpilot-info-soft: #e4eefb;
        --clawpilot-focus: #2f7765;
        --clawpilot-shadow: 0 18px 48px rgba(24, 48, 41, 0.12);
        --clawpilot-shadow-soft: 0 8px 24px rgba(24, 48, 41, 0.08);
        --clawpilot-radius-sm: 10px;
        --clawpilot-radius: 16px;
        --clawpilot-radius-lg: 24px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--clawpilot-bg);
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--clawpilot-text);
        background:
          radial-gradient(circle at top left, var(--clawpilot-accent-soft), transparent 34rem),
          var(--clawpilot-bg);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        line-height: 1.5;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      a {
        color: var(--clawpilot-info);
      }

      .app-shell {
        width: min(1440px, 100%);
        margin: 0 auto;
        padding: 28px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
        padding: 24px 28px;
        color: var(--clawpilot-text-inverse);
        background: var(--clawpilot-surface-strong);
        border-radius: var(--clawpilot-radius-lg);
        box-shadow: var(--clawpilot-shadow);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand-mark {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        color: var(--clawpilot-surface-strong);
        background: var(--clawpilot-accent);
        border-radius: 14px;
        font-weight: 900;
        letter-spacing: -0.05em;
      }

      .brand h1 {
        margin: 0;
        font-size: clamp(1.25rem, 2vw, 1.7rem);
        letter-spacing: -0.03em;
      }

      .brand p {
        margin: 2px 0 0;
        color: var(--clawpilot-surface-alt);
        font-size: 0.9rem;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        flex-wrap: wrap;
      }

      .account-pill {
        max-width: 280px;
        overflow: hidden;
        padding: 8px 12px;
        color: var(--clawpilot-surface-alt);
        border: 1px solid var(--clawpilot-muted);
        border-radius: 999px;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 0.85rem;
      }

      .nav {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 24px;
        padding: 8px;
        background: var(--clawpilot-surface);
        border: 1px solid var(--clawpilot-border);
        border-radius: var(--clawpilot-radius);
        box-shadow: var(--clawpilot-shadow-soft);
      }

      .nav button {
        padding: 12px 16px;
        color: var(--clawpilot-muted);
        background: transparent;
        border: 0;
        border-radius: var(--clawpilot-radius-sm);
        cursor: pointer;
        font-weight: 750;
      }

      .nav button[aria-selected="true"] {
        color: var(--clawpilot-text-inverse);
        background: var(--clawpilot-surface-strong);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }

      .stat {
        padding: 20px;
        background: var(--clawpilot-surface);
        border: 1px solid var(--clawpilot-border);
        border-radius: var(--clawpilot-radius);
        box-shadow: var(--clawpilot-shadow-soft);
      }

      .stat-value {
        display: block;
        margin-bottom: 2px;
        font-size: 2rem;
        font-weight: 900;
        letter-spacing: -0.05em;
      }

      .stat-label {
        color: var(--clawpilot-muted);
        font-size: 0.88rem;
        font-weight: 700;
      }

      .panel,
      .card {
        background: var(--clawpilot-surface);
        border: 1px solid var(--clawpilot-border);
        border-radius: var(--clawpilot-radius);
        box-shadow: var(--clawpilot-shadow-soft);
      }

      .panel {
        padding: 24px;
      }

      .panel + .panel {
        margin-top: 20px;
      }

      .panel-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
      }

      .panel-header h2,
      .panel-header h3 {
        margin: 0;
        letter-spacing: -0.025em;
      }

      .panel-header p {
        max-width: 720px;
        margin: 5px 0 0;
        color: var(--clawpilot-muted);
      }

      .grid {
        display: grid;
        gap: 16px;
      }

      .grid-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .grid-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      label,
      .label {
        font-size: 0.84rem;
        font-weight: 800;
      }

      .hint {
        color: var(--clawpilot-muted);
        font-size: 0.78rem;
      }

      input,
      select,
      textarea {
        width: 100%;
        color: var(--clawpilot-text);
        background: var(--clawpilot-surface);
        border: 1px solid var(--clawpilot-border);
        border-radius: var(--clawpilot-radius-sm);
        outline: none;
        transition: border-color 120ms ease, box-shadow 120ms ease;
      }

      input,
      select {
        height: 44px;
        padding: 0 12px;
      }

      textarea {
        min-height: 108px;
        padding: 11px 12px;
        resize: vertical;
      }

      input:focus,
      select:focus,
      textarea:focus,
      button:focus-visible,
      a:focus-visible {
        border-color: var(--clawpilot-focus);
        box-shadow: 0 0 0 3px var(--clawpilot-positive-soft);
      }

      .button-row {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
        flex-wrap: wrap;
      }

      .button-row.start {
        justify-content: flex-start;
      }

      .btn {
        min-height: 40px;
        padding: 9px 15px;
        color: var(--clawpilot-text);
        background: var(--clawpilot-surface);
        border: 1px solid var(--clawpilot-border);
        border-radius: 999px;
        cursor: pointer;
        font-weight: 800;
      }

      .btn:hover {
        border-color: var(--clawpilot-muted);
      }

      .btn-primary {
        color: var(--clawpilot-text-inverse);
        background: var(--clawpilot-accent);
        border-color: var(--clawpilot-accent);
      }

      .btn-primary:hover {
        background: var(--clawpilot-accent-strong);
        border-color: var(--clawpilot-accent-strong);
      }

      .btn-dark {
        color: var(--clawpilot-text-inverse);
        background: var(--clawpilot-surface-strong);
        border-color: var(--clawpilot-surface-strong);
      }

      .btn-danger {
        color: var(--clawpilot-danger);
        background: var(--clawpilot-danger-soft);
        border-color: var(--clawpilot-danger-soft);
      }

      .btn:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .prospect-card {
        position: relative;
        display: grid;
        gap: 14px;
        padding: 20px;
      }

      .prospect-card.selected {
        border-color: var(--clawpilot-focus);
        box-shadow: 0 0 0 3px var(--clawpilot-positive-soft);
      }

      .prospect-head {
        display: flex;
        align-items: flex-start;
        gap: 13px;
      }

      .prospect-head input {
        width: 20px;
        height: 20px;
        margin-top: 3px;
      }

      .prospect-title {
        flex: 1;
        min-width: 0;
      }

      .prospect-title h3 {
        margin: 0;
        font-size: 1.08rem;
      }

      .prospect-title p {
        margin: 3px 0 0;
        color: var(--clawpilot-muted);
        overflow-wrap: anywhere;
      }

      .meta-row,
      .chip-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .chip,
      .status {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        padding: 4px 9px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 850;
      }

      .chip {
        color: var(--clawpilot-muted);
        background: var(--clawpilot-surface-alt);
      }

      .status-discovered,
      .status-contact-approved,
      .status-preparing {
        color: var(--clawpilot-info);
        background: var(--clawpilot-info-soft);
      }

      .status-draft-ready,
      .status-sent {
        color: var(--clawpilot-warning);
        background: var(--clawpilot-warning-soft);
      }

      .status-replied {
        color: var(--clawpilot-positive);
        background: var(--clawpilot-positive-soft);
      }

      .status-error,
      .status-rejected {
        color: var(--clawpilot-danger);
        background: var(--clawpilot-danger-soft);
      }

      .excerpt {
        margin: 0;
        color: var(--clawpilot-muted);
        font-size: 0.9rem;
      }

      .notice {
        margin-bottom: 18px;
        padding: 13px 15px;
        border-radius: var(--clawpilot-radius-sm);
        font-size: 0.88rem;
      }

      .notice-info {
        color: var(--clawpilot-info);
        background: var(--clawpilot-info-soft);
      }

      .notice-warning {
        color: var(--clawpilot-warning);
        background: var(--clawpilot-warning-soft);
      }

      .notice-danger {
        color: var(--clawpilot-danger);
        background: var(--clawpilot-danger-soft);
      }

      .empty {
        display: grid;
        min-height: 220px;
        place-items: center;
        padding: 32px;
        color: var(--clawpilot-muted);
        text-align: center;
        border: 1px dashed var(--clawpilot-border);
        border-radius: var(--clawpilot-radius);
      }

      .pipeline-table {
        width: 100%;
        border-collapse: collapse;
      }

      .pipeline-table th,
      .pipeline-table td {
        padding: 13px 12px;
        border-bottom: 1px solid var(--clawpilot-border);
        text-align: left;
        vertical-align: top;
      }

      .pipeline-table th {
        color: var(--clawpilot-muted);
        font-size: 0.76rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .pipeline-table tr:last-child td {
        border-bottom: 0;
      }

      .table-wrap {
        overflow-x: auto;
      }

      .context-row,
      .secret-row {
        display: grid;
        grid-template-columns: minmax(170px, 0.35fr) minmax(0, 1fr) auto;
        gap: 10px;
        align-items: start;
        margin-bottom: 10px;
      }

      .context-row textarea {
        min-height: 76px;
      }

      .secret-row {
        grid-template-columns: minmax(210px, 0.45fr) minmax(0, 1fr) auto;
        align-items: center;
      }

      .configured {
        color: var(--clawpilot-positive);
        font-size: 0.78rem;
        font-weight: 800;
      }

      .not-configured {
        color: var(--clawpilot-muted);
        font-size: 0.78rem;
        font-weight: 800;
      }

      .setup {
        display: grid;
        min-height: calc(100vh - 56px);
        place-items: center;
      }

      .setup-card {
        width: min(680px, 100%);
        padding: clamp(28px, 6vw, 56px);
        text-align: center;
      }

      .setup-card .brand-mark {
        margin: 0 auto 20px;
      }

      .setup-card h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 6vw, 3.5rem);
        letter-spacing: -0.06em;
      }

      .setup-card p {
        margin: 0 auto;
        max-width: 560px;
        color: var(--clawpilot-muted);
      }

      dialog {
        width: min(760px, calc(100% - 32px));
        max-height: calc(100vh - 32px);
        padding: 0;
        color: var(--clawpilot-text);
        background: var(--clawpilot-surface);
        border: 1px solid var(--clawpilot-border);
        border-radius: var(--clawpilot-radius-lg);
        box-shadow: var(--clawpilot-shadow);
      }

      dialog::backdrop {
        background: var(--clawpilot-surface-strong);
        opacity: 0.58;
      }

      .dialog-inner {
        max-height: calc(100vh - 34px);
        overflow-y: auto;
        padding: 24px;
      }

      .dialog-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 20px;
      }

      .dialog-header h2 {
        margin: 0;
      }

      .icon-button {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        color: var(--clawpilot-muted);
        background: transparent;
        border: 1px solid var(--clawpilot-border);
        border-radius: 50%;
        cursor: pointer;
        font-size: 1.3rem;
      }

      .loading {
        position: fixed;
        z-index: 1000;
        inset: 0;
        display: none;
        place-items: center;
        padding: 24px;
        background: var(--clawpilot-surface-strong);
        opacity: 0.96;
      }

      .loading.visible {
        display: grid;
      }

      .loading-card {
        color: var(--clawpilot-text-inverse);
        text-align: center;
      }

      .spinner {
        width: 46px;
        height: 46px;
        margin: 0 auto 16px;
        border: 4px solid var(--clawpilot-muted);
        border-top-color: var(--clawpilot-accent);
        border-radius: 50%;
        animation: spin 800ms linear infinite;
      }

      .toast {
        position: fixed;
        z-index: 1100;
        right: 24px;
        bottom: 24px;
        width: min(420px, calc(100% - 48px));
        padding: 14px 16px;
        color: var(--clawpilot-text-inverse);
        background: var(--clawpilot-surface-strong);
        border-radius: var(--clawpilot-radius-sm);
        box-shadow: var(--clawpilot-shadow);
        transform: translateY(140%);
        transition: transform 180ms ease;
      }

      .toast.visible {
        transform: translateY(0);
      }

      .toast.error {
        background: var(--clawpilot-danger);
      }

      .muted {
        color: var(--clawpilot-muted);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 900px) {
        .app-shell {
          padding: 16px;
        }

        .topbar,
        .panel-header {
          align-items: stretch;
          flex-direction: column;
        }

        .topbar-actions {
          justify-content: flex-start;
        }

        .stats,
        .cards,
        .grid-2,
        .grid-3 {
          grid-template-columns: 1fr;
        }

        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .context-row,
        .secret-row {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 620px) {
        .nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .stats {
          grid-template-columns: 1fr;
        }

        .button-row .btn {
          width: 100%;
        }
      }

<meta name="application-name" content="Finding Internships" />
<style>.brand-mark.brand-image { display:block; object-fit:contain; padding:0; background:none; box-shadow:none; border-radius:0; }</style>
</head>
  <body>
    <main id="app" class="app-shell" aria-live="polite"></main>

    <dialog id="draft-dialog">
      <div class="dialog-inner">
        <div class="dialog-header">
          <div>
            <h2 id="draft-dialog-title">Review outreach</h2>
            <p id="draft-dialog-subtitle" class="muted"></p>
          </div>
          <button class="icon-button" type="button" aria-label="Close" onclick="closeDraftDialog()">x</button>
        </div>
        <form id="draft-form" onsubmit="return false">
          <input id="draft-id" type="hidden">
          <div class="grid grid-2">
            <div class="field">
              <label for="draft-email">Email</label>
              <input id="draft-email" type="email" autocomplete="off" required>
            </div>
            <div class="field">
              <label for="draft-linkedin">LinkedIn profile</label>
              <input id="draft-linkedin" type="url" readonly>
            </div>
            <div class="field full">
              <label for="draft-subject">Subject</label>
              <input id="draft-subject" maxlength="200" required>
            </div>
            <div class="field full">
              <label for="draft-body">Email body</label>
              <textarea id="draft-body" rows="14" required></textarea>
              <span id="draft-word-count" class="hint"></span>
            </div>
            <div class="field full">
              <span class="label">Personalization audit</span>
              <p id="draft-notes" class="notice notice-info"></p>
            </div>
          </div>
          <div class="button-row">
            <button class="btn" type="button" onclick="saveDraft()">Save changes</button>
            <button class="btn btn-primary" type="button" onclick="sendDraft()">Approve and send now</button>
          </div>
        </form>
      </div>
    </dialog>

    <div id="loading" class="loading" role="status" aria-live="assertive">
      <div class="loading-card">
        <div class="spinner" aria-hidden="true"></div>
        <strong id="loading-message">Working...</strong>
      </div>
    </div>

    <div id="toast" class="toast" role="status"></div>

    <script>
      const ui = {
        state: null,
        tab: 'find',
        selected: new Set(),
        toastTimer: null
      };

      document.addEventListener('DOMContentLoaded', loadApp);
      document.getElementById('draft-body').addEventListener('input', updateDraftWordCount);

      async function loadApp() {
        try {
          setLoading(true, 'Loading your outreach workspace...');
          ui.state = await server('getAppState');
          render();
        } catch (error) {
          renderFatal(error);
        } finally {
          setLoading(false);
        }
      }

      function server(method, payload) {
        return new Promise((resolve, reject) => {
          const runner = google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler((error) => reject(new Error(error && error.message ? error.message : String(error))));
          if (payload === undefined) {
            runner[method]();
          } else {
            runner[method](payload);
          }
        });
      }

      function render() {
        const root = document.getElementById('app');
        if (ui.state.setupRequired) {
          root.innerHTML = renderSetup();
          return;
        }
        root.innerHTML = [
          renderTopbar(),
          renderNavigation(),
          renderStats(),
          renderActiveTab()
        ].join('');
        restoreSelectedCards();
      }

      function renderSetup() {
        return `

      function renderNavigation() {
        const tabs = [
          ['find', 'Find people'],
          ['approve', 'Approve people'],
          ['outreach', 'Outreach'],
          ['settings', 'Profile & connections']
        ];
        return `
          <nav class="nav" aria-label="Primary">
            ${tabs.map(([id, label]) => `
              <button type="button" aria-selected="${ui.tab === id}" onclick="setTab('${id}')">${label}</button>
            `).join('')}
          </nav>
        `;
      }

      function renderStats() {
        const summary = ui.state.summary;
        const stats = [
          [summary.total, 'People tracked'],
          [summary.awaitingDraftApproval, 'Drafts to approve'],
          [summary.awaitingReply, 'Awaiting replies'],
          [summary.replied, 'Replies received']
        ];
        return `
          <section class="stats" aria-label="Outreach summary">
            ${stats.map(([value, label]) => `
              <article class="stat">
                <span class="stat-value">${Number(value || 0)}</span>
                <span class="stat-label">${label}</span>
              </article>
            `).join('')}
          </section>
        `;
      }

      function renderActiveTab() {
        if (ui.tab === 'approve') return renderApprovals();
        if (ui.tab === 'outreach') return renderOutreach();
        if (ui.tab === 'settings') return renderSettings();
        return renderFind();
      }

      function renderFind() {
        const criteria = ui.state.lastCriteria || {};
        const readiness = getReadiness();
        return `
          <section class="panel">
            <div class="panel-header">
              <div>
                <h2>Find relevant people</h2>
                <p>
                  Search publicly indexed professional profile pages. The agent does not scrape
                  LinkedIn or automate LinkedIn messages.
                </p>
              </div>
              <span class="status ${readiness.discovery ? 'status-replied' : 'status-error'}">
                ${readiness.discovery ? 'Discovery ready' : 'Configure discovery'}
              </span>
            </div>
            ${readiness.discovery ? '' : `
              <div class="notice notice-warning">
                Add a Tavily API key or a custom discovery webhook under Profile & connections
                before running a search.
              </div>
            `}
            <form id="discovery-form" onsubmit="runDiscovery(event)">
              <div class="grid grid-2">
                ${textAreaField('roles', 'Target roles', criteria.roles, 'e.g. Product Manager, Corporate Strategy')}
                ${textAreaField('industries', 'Industries', criteria.industries, 'e.g. fintech, enterprise software')}
                ${textAreaField('companies', 'Companies', criteria.companies, 'Optional target employers')}
                ${textAreaField('locations', 'Locations', criteria.locations, 'e.g. Toronto, New York')}
                ${textAreaField('keywords', 'Keywords or experiences', criteria.keywords, 'e.g. marketplace, M&A, growth')}
                ${textAreaField('seniority', 'Seniority', criteria.seniority, 'e.g. Director, VP, Partner')}
                <div class="field full">
                  <label for="objective">Why you want to meet them</label>
                  <textarea id="objective" name="objective" placeholder="What are you trying to learn?">${escapeHtml(criteria.objective || '')}</textarea>
                </div>
                <div class="field">
                  <label for="count">Number of people</label>
                  <input id="count" name="count" type="number" min="1" max="20" value="${Number(criteria.count || 10)}">
                </div>
              </div>
              <div class="button-row">
                <button class="btn btn-primary" type="submit" ${readiness.discovery ? '' : 'disabled'}>Find people</button>
              </div>
            </form>
          </section>
          <section class="panel">
            <div class="panel-header">
              <div>
                <h3>Add someone manually</h3>
                <p>Use this when you already know who you want to contact.</p>
              </div>
            </div>
            <form id="manual-form" onsubmit="addManualPerson(event)">
              <div class="grid grid-3">
                ${inputField('manual-full-name', 'Full name', '', 'text', true)}
                ${inputField('manual-title', 'Title', '', 'text', false)}
                ${inputField('manual-company', 'Company', '', 'text', false)}
                ${inputField('manual-linkedin', 'LinkedIn URL', '', 'url', false)}
                ${inputField('manual-email', 'Email, if known', '', 'email', false)}
                ${inputField('manual-domain', 'Company domain', '', 'text', false)}
                <div class="field full">
                  <label for="manual-relevance">Why this person is relevant</label>
                  <textarea id="manual-relevance"></textarea>
                </div>
              </div>
              <div class="button-row">
                <button class="btn" type="submit">Add to approval list</button>
              </div>
            </form>
          </section>
        `;
      }

      function renderApprovals() {
        const people = ui.state.prospects.filter((prospect) =>
          ['DISCOVERED', 'ERROR'].includes(prospect.status)
        );
        const readiness = getReadiness();
        return `
          <section class="panel">
            <div class="panel-header">
              <div>
                <h2>Approve people</h2>
                <p>
                  Select only the people you genuinely want to contact. Approval triggers email
                  enrichment, when configured, and prepares a personalized draft. It never sends.
                </p>
              </div>
              <span class="chip">${people.length} waiting</span>
            </div>
            ${readiness.drafting ? '' : `
              <div class="notice notice-warning">
                Drafting is not ready. Select the built-in template or add the key required by
                your selected Gemini, OpenAI, Anthropic, or custom provider under Profile &
                connections.
              </div>
            `}
            ${readiness.enrichment ? '' : `
              <div class="notice notice-warning">
                The selected enrichment provider is not configured. Choose NONE for manual email
                entry or configure the provider.
              </div>
            `}
            ${people.length ? `
              <div class="button-row start">
                <button class="btn btn-dark" onclick="prepareSelected()" ${readiness.drafting && readiness.enrichment ? '' : 'disabled'}>
                  Approve selected and prepare drafts
                </button>
                <button class="btn btn-danger" onclick="rejectSelected()">Reject selected</button>
                <button class="btn" onclick="toggleAllApprovals(true)">Select all</button>
                <button class="btn" onclick="toggleAllApprovals(false)">Clear</button>
              </div>
              <div class="cards" style="margin-top: 18px;">
                ${people.map(renderApprovalCard).join('')}
              </div>

          </section>
        `;

      function renderApprovalCard(person) {
        const selected = ui.selected.has(person.id);
        return `
          <article class="card prospect-card ${selected ? 'selected' : ''}" data-card-id="${escapeAttr(person.id)}">
            <div class="prospect-head">
              <input
                type="checkbox"
                aria-label="Select ${escapeAttr(person.fullName)}"
                data-prospect-id="${escapeAttr(person.id)}"
                ${selected ? 'checked' : ''}
                onchange="toggleProspectSelection(this)"
              >
              <div class="prospect-title">
                <h3>${escapeHtml(person.fullName)}</h3>
                <p>${escapeHtml([person.title, person.company].filter(Boolean).join(' at ') || 'Professional profile')}</p>
              </div>
              <span class="status ${statusClass(person.status)}">${formatStatus(person.status)}</span>
            </div>
            <div class="chip-row">
              <span class="chip">Relevance ${Number(person.relevanceScore || 0)}/100</span>
              ${person.location ? `<span class="chip">${escapeHtml(person.location)}</span>` : ''}
              ${person.email ? `<span class="chip">Email found</span>` : ''}
            </div>
            <p class="excerpt">${escapeHtml(person.whyRelevant || person.sourceSnippet || 'Review the public profile before approving.')}</p>
            ${person.error ? `<div class="notice notice-danger">${escapeHtml(person.error)}</div>` : ''}
            <div class="meta-row">
              ${safeUrl(person.linkedinUrl, true) ? `<a href="${escapeAttr(safeUrl(person.linkedinUrl, true))}" target="_blank" rel="noopener">View public profile</a>` : ''}
              ${safeUrl(person.sourceUrl) && person.sourceUrl !== person.linkedinUrl ? `<a href="${escapeAttr(safeUrl(person.sourceUrl))}" target="_blank" rel="noopener">Source</a>` : ''}
            </div>
          </article>
        `;
      }

      function renderOutreach() {
        const drafts = ui.state.prospects.filter((prospect) => prospect.status === 'DRAFT_READY');
        const pipeline = ui.state.prospects.filter((prospect) =>
          ['SENT', 'REPLIED', 'SENDING'].includes(prospect.status)
        );
        return `
          <section class="panel">
            <div class="panel-header">
              <div>
                <h2>Drafts awaiting approval</h2>
                <p>Review and edit every message. Sending requires a separate explicit confirmation.</p>
              </div>
              <span class="chip">${drafts.length} drafts</span>
            </div>
            ${drafts.length ? `
              <div class="cards">
                ${drafts.map((person) => `
                  <article class="card prospect-card">
                    <div class="prospect-head">
                      <div class="prospect-title">
                        <h3>${escapeHtml(person.fullName)}</h3>
                        <p>${escapeHtml([person.title, person.company].filter(Boolean).join(' at '))}</p>
                      </div>
                      <span class="status status-draft-ready">Draft ready</span>
                    </div>
                    <div class="chip-row">
                      <span class="chip">${person.email ? escapeHtml(person.email) : 'Email needed'}</span>
                      ${person.emailConfidence ? `<span class="chip">${Number(person.emailConfidence)}% confidence</span>` : ''}
                    </div>
                    <p class="excerpt"><strong>${escapeHtml(person.subject)}</strong></p>
                    <p class="excerpt">${escapeHtml(truncate(person.draftBody, 210))}</p>
                    ${person.error ? `<div class="notice notice-danger">${escapeHtml(person.error)}</div>` : ''}
                    <div class="button-row start">
                      <button class="btn btn-primary" onclick="openDraftDialog('${escapeJs(person.id)}')">Review draft</button>
                      <button class="btn" onclick="regenerateDraft('${escapeJs(person.id)}')">Regenerate draft</button>
                      ${safeUrl(person.linkedinUrl, true) ? `<a class="btn" href="${escapeAttr(safeUrl(person.linkedinUrl, true))}" target="_blank" rel="noopener">Profile</a>` : ''}
                    </div>
                  </article>
                `).join('')}
              </div>
            ` : renderEmpty('No drafts are waiting.', 'Approve people to prepare personalized messages.')}
          </section>
          <section class="panel">
            <div class="panel-header">
              <div>
                <h2>Sent outreach and replies</h2>
                <p>Gmail reply status is checked automatically and can be refreshed manually.</p>
              </div>
            </div>
            ${pipeline.length ? renderPipelineTable(pipeline) : renderEmpty('No emails have been sent.', 'Approved messages will appear here after sending.')}
          </section>
        `;
      }

      function renderPipelineTable(people) {
        return `
          <div class="table-wrap">
            <table class="pipeline-table">
              <thead>
                <tr>
                  <th>Person</th>
                  <th>Status</th>
                  <th>Sent</th>
                  <th>Latest reply</th>
                  <th>Links</th>
                </tr>
              </thead>
              <tbody>
                ${people.map((person) => `
                  <tr>
                    <td>
                      <strong>${escapeHtml(person.fullName)}</strong><br>
                      <span class="muted">${escapeHtml([person.title, person.company].filter(Boolean).join(' at '))}</span>
                    </td>
                    <td><span class="status ${statusClass(person.status)}">${formatStatus(person.status)}</span></td>
                    <td>${formatDate(person.sentAt)}</td>
                    <td>
                      ${person.lastReplyAt ? `
                        <strong>${formatDate(person.lastReplyAt)}</strong><br>

                      ` : '<span class="muted">No reply yet</span>'}
                    </td>
                    <td>
                      ${safeUrl(person.linkedinUrl, true) ? `<a href="${escapeAttr(safeUrl(person.linkedinUrl, true))}" target="_blank" rel="noopener">Profile</a>` : ''}

                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>

      function renderSettings() {
        const settings = ui.state.settings;
        return `
          <section class="panel">
            <div class="panel-header">
              <div>
                <h2>Your voice and experience</h2>
                <p>
                  Drafts may use only facts entered here. Add concrete experiences and a sample
                  email so the message sounds like you without inventing details.
                </p>
              </div>
            </div>
            <div class="notice notice-info">
              This profile and its credentials are isolated to
              <strong>${escapeHtml(ui.state.accountEmail)}</strong>. Other Google users receive
              separate Sheets, keys, settings, Gmail authorization, and reply triggers.
            </div>
            <div id="context-rows">
              ${ui.state.personalContext.map(renderContextRow).join('')}
            </div>
            <div class="button-row start">
              <button class="btn" onclick="addContextRow()">Add context field</button>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <div>
                <h2>Workflow settings</h2>
                <p>Choose interchangeable providers and control message length and reply checks.</p>
              </div>
            </div>
            <div class="grid grid-3">
              ${inputField('setting-sender-name', 'Your name', settings.SENDER_NAME || '', 'text', true)}
              ${selectField('setting-discovery', 'Discovery provider', settings.DISCOVERY_PROVIDER, [
                ['TAVILY', 'Tavily free search'],
                ['CUSTOM_WEBHOOK', 'Custom webhook']
              ])}
              ${selectField('setting-enrichment', 'Email enrichment', settings.ENRICHMENT_PROVIDER, [
                ['NONE', 'None / manual entry'],
                ['HUNTER', 'Hunter free tier'],
                ['CUSTOM_WEBHOOK', 'Custom webhook']
              ])}
              ${selectField('setting-draft', 'Draft provider', settings.DRAFT_PROVIDER, [
                ['TEMPLATE', 'Built-in personal template'],
                ['GEMINI', 'Google Gemini'],
                ['OPENAI', 'OpenAI'],
                ['ANTHROPIC', 'Anthropic Claude'],
                ['CUSTOM_WEBHOOK', 'Custom webhook']
              ])}
              ${inputField('setting-gemini-model', 'Gemini model', settings.GEMINI_MODEL || 'gemini-3.8-flash', 'text', false)}
              ${inputField('setting-openai-model', 'OpenAI model', settings.OPENAI_MODEL || 'gpt-5-mini', 'text', false)}
              ${inputField('setting-anthropic-model', 'Anthropic model', settings.ANTHROPIC_MODEL || 'claude-haiku-4-5', 'text', false)}
              ${inputField('setting-word-limit', 'Email word limit', settings.EMAIL_WORD_LIMIT || 140, 'number', true, '60', '250')}
              ${inputField('setting-result-limit', 'Discovery result limit', settings.MAX_DISCOVERY_RESULTS || 15, 'number', true, '1', '20')}
              ${selectField('setting-sync-interval', 'Reply sync interval', settings.SYNC_INTERVAL_MINUTES || '15', [
                ['1', 'Every minute'],
                ['5', 'Every 5 minutes'],
                ['10', 'Every 10 minutes'],
                ['15', 'Every 15 minutes'],
                ['30', 'Every 30 minutes']
              ])}
              ${inputField('setting-lookback', 'Reply lookback days', settings.REPLY_LOOKBACK_DAYS || 60, 'number', true, '1', '365')}
              <div class="field full">
                <label for="setting-goal">Default outreach goal</label>
                <textarea id="setting-goal">${escapeHtml(settings.OUTREACH_GOAL || '')}</textarea>
              </div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <div>
                <h2>Private connection credentials</h2>
                <p>
                  Values are stored in Google Apps Script User Properties for the signed-in account,
                  not in the spreadsheet, browser, or another user's workspace. Leave a field blank
                  to keep its current value.
                </p>
              </div>
            </div>
            <div id="secret-rows">
              ${secretField('TAVILY_API_KEY', 'Tavily API key')}
              ${secretField('GEMINI_API_KEY', 'Gemini API key')}
              ${secretField('OPENAI_API_KEY', 'OpenAI API key')}
              ${secretField('ANTHROPIC_API_KEY', 'Anthropic API key')}
              ${secretField('HUNTER_API_KEY', 'Hunter API key')}
              ${secretField('DISCOVERY_WEBHOOK_URL', 'Discovery webhook URL', 'url')}
              ${secretField('DISCOVERY_WEBHOOK_TOKEN', 'Discovery webhook token')}
              ${secretField('ENRICHMENT_WEBHOOK_URL', 'Enrichment webhook URL', 'url')}
              ${secretField('ENRICHMENT_WEBHOOK_TOKEN', 'Enrichment webhook token')}
              ${secretField('DRAFT_WEBHOOK_URL', 'Draft webhook URL', 'url')}
              ${secretField('DRAFT_WEBHOOK_TOKEN', 'Draft webhook token')}
            </div>
            <div class="notice notice-info">
              Recommended free starting setup: Tavily for public profile discovery, Hunter's free
              tier for work-email discovery, and the built-in template for drafts. Gemini, OpenAI,
              and Anthropic use the signed-in user's own API key and provider billing.
            </div>
            <div class="button-row">
              <button class="btn btn-primary" onclick="saveSettings()">Save profile and connections</button>
            </div>
          </section>
        `;
      }

      function renderContextRow(item) {
        return `
          <div class="context-row">
            <input class="context-category" value="${escapeAttr(item.category || '')}" aria-label="Context category">
            <textarea class="context-content" aria-label="Context content">${escapeHtml(item.content || '')}</textarea>
            <button class="btn btn-danger" type="button" onclick="this.closest('.context-row').remove()">Remove</button>
          </div>
        `;
      }

      function secretField(key, label, type = 'password') {
        const configured = Boolean(ui.state.secretConfiguration[key]);
        return `
          <div class="secret-row" data-secret-key="${escapeAttr(key)}">
            <div>
              <label for="secret-${escapeAttr(key)}">${escapeHtml(label)}</label><br>
              <span class="${configured ? 'configured' : 'not-configured'}">${configured ? 'Configured' : 'Not configured'}</span>
            </div>
            <input
              id="secret-${escapeAttr(key)}"
              class="secret-input"
              type="${escapeAttr(type)}"
              autocomplete="off"
              placeholder="${configured ? 'Leave blank to keep current value' : 'Enter value'}"
            >
            <button class="btn btn-danger" type="button" ${configured ? '' : 'disabled'} onclick="clearSecret('${escapeJs(key)}')">Clear</button>
          </div>
        `;
      }

      function textAreaField(id, label, value, placeholder) {
        const normalized = Array.isArray(value) ? value.join('\n') : (value || '');
        return `
          <div class="field">
            <label for="${escapeAttr(id)}">${escapeHtml(label)}</label>
            <textarea id="${escapeAttr(id)}" name="${escapeAttr(id)}" placeholder="${escapeAttr(placeholder)}">${escapeHtml(normalized)}</textarea>
          </div>
        `;
      }

      function inputField(id, label, value, type, required, min, max) {
        return `
          <div class="field">
            <label for="${escapeAttr(id)}">${escapeHtml(label)}</label>
            <input
              id="${escapeAttr(id)}"
              type="${escapeAttr(type || 'text')}"
              value="${escapeAttr(value === undefined ? '' : value)}"
              ${required ? 'required' : ''}
              ${min !== undefined ? `min="${escapeAttr(min)}"` : ''}
              ${max !== undefined ? `max="${escapeAttr(max)}"` : ''}
            >
          </div>
        `;
      }

      function selectField(id, label, selected, options) {
        return `
          <div class="field">
            <label for="${escapeAttr(id)}">${escapeHtml(label)}</label>
            <select id="${escapeAttr(id)}">
              ${options.map(([value, text]) => `
                <option value="${escapeAttr(value)}" ${String(selected) === String(value) ? 'selected' : ''}>${escapeHtml(text)}</option>
              `).join('')}
            </select>
          </div>
        `;
      }

      function renderEmpty(title, detail) {
        return `<div class="empty"><div><strong>${escapeHtml(title)}</strong><br>${escapeHtml(detail)}</div></div>`;
      }

      async function initializeAgent() {
        try {
          setLoading(true, 'Creating your private Google Sheet and reply trigger...');
          ui.state = await server('initializeAgent');
          showToast('Workspace initialized.');
          render();
        } catch (error) {
          showToast(error.message, true);
        } finally {
          setLoading(false);
        }
      }

      function setTab(tab) {
        ui.tab = tab;
        ui.selected.clear();
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      async function runDiscovery(event) {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const criteria = {
          roles: form.get('roles'),
          industries: form.get('industries'),
          companies: form.get('companies'),
          locations: form.get('locations'),
          keywords: form.get('keywords'),
          seniority: form.get('seniority'),
          objective: form.get('objective'),
          count: Number(form.get('count') || 10)
        };
        try {
          setLoading(true, 'Searching public professional profiles...');
          const result = await server('discoverProspects', criteria);
          await refreshState();
          ui.tab = 'approve';
          render();
          showToast(`Added ${result.inserted} people. ${result.duplicatesSkipped} duplicates skipped.`);
        } catch (error) {
          showToast(error.message, true);
        } finally {
          setLoading(false);
        }
      }

      async function addManualPerson(event) {
        event.preventDefault();
        const payload = {
          fullName: value('manual-full-name'),
          title: value('manual-title'),
          company: value('manual-company'),
          linkedinUrl: value('manual-linkedin'),
          email: value('manual-email'),
          companyDomain: value('manual-domain'),
          whyRelevant: value('manual-relevance')
        };
        try {
          setLoading(true, 'Adding person...');
          await server('addManualProspect', payload);
          await refreshState();
          ui.tab = 'approve';
          render();
          showToast('Person added to the approval list.');
        } catch (error) {
          showToast(error.message, true);
        } finally {
          setLoading(false);
        }
      }

      function toggleProspectSelection(checkbox) {
        const id = checkbox.dataset.prospectId;
        if (checkbox.checked) {
          ui.selected.add(id);
        } else {
          ui.selected.delete(id);
        }
        const card = document.querySelector(`[data-card-id="${cssEscape(id)}"]`);
        if (card) card.classList.toggle('selected', checkbox.checked);
      }

      function toggleAllApprovals(checked) {
        document.querySelectorAll('[data-prospect-id]').forEach((checkbox) => {
          checkbox.checked = checked;
          toggleProspectSelection(checkbox);
        });
      }

      async function prepareSelected() {
        const ids = Array.from(ui.selected);
        if (!ids.length) {
          showToast('Select at least one person.', true);
          return;
        }
        try {
          setLoading(true, 'Enriching contacts and preparing personalized drafts...');
          const result = await server('approveAndPrepareProspects', ids);
          await refreshState();
          ui.selected.clear();
          ui.tab = result.succeeded ? 'outreach' : 'approve';
          render();
          if (result.failed) {
            showToast(`${result.succeeded} prepared; ${result.failed} need attention.`, true);
          } else {
            showToast(`${result.succeeded} draft${result.succeeded === 1 ? '' : 's'} prepared for review.`);
          }
        } catch (error) {
          showToast(error.message, true);
        } finally {
          setLoading(false);
        }
      }

      async function rejectSelected() {
        const ids = Array.from(ui.selected);
        if (!ids.length) {
          showToast('Select at least one person.', true);
          return;
        }
        if (!window.confirm(`Reject ${ids.length} selected ${ids.length === 1 ? 'person' : 'people'}?`)) {
          return;
        }
        try {
          setLoading(true, 'Updating approval list...');
          await server('rejectProspects', ids);
          await refreshState();
          ui.selected.clear();
          render();
          showToast('Selected people were rejected.');
        } catch (error) {
          showToast(error.message, true);
        } finally {
          setLoading(false);
        }
      }

      function openDraftDialog(id) {
        const person = ui.state.prospects.find((item) => item.id === id);
        if (!person) return;
        document.getElementById('draft-id').value = person.id;
        document.getElementById('draft-dialog-title').textContent = `Review outreach to ${person.fullName}`;
        document.getElementById('draft-dialog-subtitle').textContent =
          [person.title, person.company].filter(Boolean).join(' at ');
        document.getElementById('draft-email').value = person.email || '';
        document.getElementById('draft-linkedin').value = person.linkedinUrl || '';
        document.getElementById('draft-subject').value = person.subject || '';
        document.getElementById('draft-body').value = person.draftBody || '';
        document.getElementById('draft-notes').textContent =
          person.personalizationNotes || 'No personalization audit was returned.';
        updateDraftWordCount();
        document.getElementById('draft-dialog').showModal();
      }

      function closeDraftDialog() {
        document.getElementById('draft-dialog').close();
      }

      function draftPayload() {
        return {
          id: value('draft-id'),
          email: value('draft-email'),
          subject: value('draft-subject'),
          draftBody: value('draft-body')
        };
      }

      async function saveDraft() {
        const payload = draftPayload();
        try {
          setLoading(true, 'Saving draft...');
          await server('saveProspectEdits', payload);
          await refreshState();
          closeDraftDialog();
          render();
          showToast('Draft saved.');
        } catch (error) {
          showToast(error.message, true);
        } finally {
          setLoading(false);
        }
      }

      async function regenerateDraft(id) {
        const provider = ui.state.settings.DRAFT_PROVIDER || 'selected provider';
        if (!window.confirm(`Replace this draft using ${provider}? No email will be sent.`)) {
          return;
        }
        try {
          setLoading(true, 'Regenerating the recipient-focused draft...');
          await server('regenerateProspectDraft', id);
          await refreshState();
          render();
          showToast('Draft regenerated for review.');
        } catch (error) {
          await refreshState();
          render();
          showToast(error.message, true);
        } finally {
          setLoading(false);
        }
      }

      async function sendDraft() {
        const payload = draftPayload();
        if (!payload.email || !payload.subject || !payload.draftBody) {
          showToast('Email, subject, and body are required.', true);
          return;
        }
        if (!window.confirm(`Send this exact email now to ${payload.email}?`)) {
          return;
        }
        try {
          setLoading(true, 'Sending approved email through Gmail...');
          await server('sendProspectEmail', {
            id: payload.id,
            email: payload.email,
            subject: payload.subject,
            body: payload.draftBody
          });
          await refreshState();
          closeDraftDialog();
          render();
          showToast('Email sent and tracked in the spreadsheet.');
        } catch (error) {
          showToast(error.message, true);
        } finally {
          setLoading(false);
        }
      }

      async function syncReplies() {
        try {
          setLoading(true, 'Checking Gmail threads for replies...');
          const result = await server('syncRepliesNow');
          await refreshState();
          render();
          if (result.errors && result.errors.length) {
            showToast(`Updated ${result.updated}; ${result.errors.length} thread checks failed.`, true);
          } else {
            showToast(`Checked ${result.checked} conversations; updated ${result.updated}.`);
          }
        } catch (error) {
          showToast(error.message, true);
        } finally {
          setLoading(false);
        }
      }

      function addContextRow() {
        document.getElementById('context-rows').insertAdjacentHTML(
          'beforeend',
          renderContextRow({ category: '', content: '' })
        );
      }

      async function saveSettings() {
        const personalContext = Array.from(document.querySelectorAll('.context-row'))
          .map((row) => ({
            category: row.querySelector('.context-category').value.trim(),
            content: row.querySelector('.context-content').value.trim()
          }))
          .filter((item) => item.category);
        const secrets = {};
        document.querySelectorAll('.secret-row').forEach((row) => {
          const input = row.querySelector('.secret-input');
          if (input.value.trim()) {
            secrets[row.dataset.secretKey] = input.value.trim();
          }
        });
        const payload = {
          settings: {
            SENDER_NAME: value('setting-sender-name'),
            DISCOVERY_PROVIDER: value('setting-discovery'),
            ENRICHMENT_PROVIDER: value('setting-enrichment'),
            DRAFT_PROVIDER: value('setting-draft'),
            GEMINI_MODEL: value('setting-gemini-model'),
            OPENAI_MODEL: value('setting-openai-model'),
            ANTHROPIC_MODEL: value('setting-anthropic-model'),
            EMAIL_WORD_LIMIT: value('setting-word-limit'),
            MAX_DISCOVERY_RESULTS: value('setting-result-limit'),
            SYNC_INTERVAL_MINUTES: value('setting-sync-interval'),
            REPLY_LOOKBACK_DAYS: value('setting-lookback'),
            OUTREACH_GOAL: value('setting-goal')
          },
          personalContext,
          secrets
        };
        if (!payload.settings.SENDER_NAME) {
          showToast('Enter your name before saving.', true);
          return;
        }
        try {
          setLoading(true, 'Saving private configuration...');
          ui.state = await server('saveConfiguration', payload);
          render();
          showToast('Profile and connections saved.');
        } catch (error) {
          showToast(error.message, true);
        } finally {
          setLoading(false);
        }
      }

      async function clearSecret(key) {
        if (!window.confirm(`Clear ${key}?`)) return;
        try {
          setLoading(true, 'Clearing credential...');
          ui.state = await server('clearConfiguredSecret', key);
          render();
          showToast('Credential cleared.');
        } catch (error) {
          showToast(error.message, true);
        } finally {
          setLoading(false);
        }
      }

      function getReadiness() {
        const settings = ui.state.settings;
        const secrets = ui.state.secretConfiguration;
        const discovery =
          (settings.DISCOVERY_PROVIDER === 'TAVILY' && secrets.TAVILY_API_KEY) ||
          (settings.DISCOVERY_PROVIDER === 'GOOGLE_CSE' &&
            secrets.GOOGLE_CSE_API_KEY &&
            secrets.GOOGLE_CSE_ID) ||
          (settings.DISCOVERY_PROVIDER === 'CUSTOM_WEBHOOK' &&
            secrets.DISCOVERY_WEBHOOK_URL);
        const enrichment =
          settings.ENRICHMENT_PROVIDER === 'NONE' ||
          (settings.ENRICHMENT_PROVIDER === 'HUNTER' && secrets.HUNTER_API_KEY) ||
          (settings.ENRICHMENT_PROVIDER === 'CUSTOM_WEBHOOK' && secrets.ENRICHMENT_WEBHOOK_URL);
        const drafting =
          settings.DRAFT_PROVIDER === 'TEMPLATE' ||
          (settings.DRAFT_PROVIDER === 'GEMINI' && secrets.GEMINI_API_KEY) ||
          (settings.DRAFT_PROVIDER === 'OPENAI' && secrets.OPENAI_API_KEY) ||
          (settings.DRAFT_PROVIDER === 'ANTHROPIC' && secrets.ANTHROPIC_API_KEY) ||
          (settings.DRAFT_PROVIDER === 'CUSTOM_WEBHOOK' && secrets.DRAFT_WEBHOOK_URL);
        return { discovery, enrichment, drafting };
      }

      async function refreshState() {
        ui.state = await server('getAppState');
      }

      function restoreSelectedCards() {
        document.querySelectorAll('[data-prospect-id]').forEach((checkbox) => {
          checkbox.checked = ui.selected.has(checkbox.dataset.prospectId);
        });
      }

      function updateDraftWordCount() {
        const body = document.getElementById('draft-body').value.trim();
        const count = body ? body.split(/\s+/).length : 0;
        const limit = Number((ui.state && ui.state.settings.EMAIL_WORD_LIMIT) || 140);
        document.getElementById('draft-word-count').textContent = `${count} words; target ${limit}`;
      }

      function setLoading(visible, message) {
        const loading = document.getElementById('loading');
        loading.classList.toggle('visible', Boolean(visible));
        if (message) document.getElementById('loading-message').textContent = message;
      }

      function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.toggle('error', isError);
        toast.classList.add('visible');
        window.clearTimeout(ui.toastTimer);
        ui.toastTimer = window.setTimeout(() => toast.classList.remove('visible'), 5000);
      }

      function renderFatal(error) {
        document.getElementById('app').innerHTML = `
          <section class="setup">
            <div class="setup-card panel">
              <div class="brand-mark" aria-hidden="true">!</div>
              <h1>Unable to load</h1>
              <p>${escapeHtml(error.message)}</p>
              <div class="button-row" style="justify-content: center;">
                <button class="btn btn-primary" onclick="loadApp()">Try again</button>
              </div>
            </div>
          </section>
        `;
      }

      function value(id) {
        const element = document.getElementById(id);
        return element ? element.value.trim() : '';
      }

      function formatStatus(status) {
        return String(status || '')
          .toLowerCase()
          .split('_')
          .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
          .join(' ');
      }

      function statusClass(status) {
        return `status-${String(status || '').toLowerCase().replace(/_/g, '-')}`;
      }

      function formatDate(value) {
        if (!value) return '<span class="muted">-</span>';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return escapeHtml(String(value));
        return escapeHtml(
          new Intl.DateTimeFormat(undefined, {
            month: 'short',
            day: 'numeric',
            year: 'numeric',
            hour: 'numeric',
            minute: '2-digit'
          }).format(date)
        );
      }

      function truncate(value, length) {
        const text = String(value || '');
        return text.length > length ? `${text.slice(0, length - 1)}...` : text;
      }

      function escapeHtml(value) {
        return String(value === null || value === undefined ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function escapeAttr(value) {
        return escapeHtml(value);
      }

      function safeUrl(value, requireLinkedIn = false) {
        try {
          const url = new URL(String(value || ''));
          if (!['https:', 'http:'].includes(url.protocol)) return '';
          if (
            requireLinkedIn &&
            !(url.hostname === 'linkedin.com' || url.hostname.endsWith('.linkedin.com'))
          ) {
            return '';
          }
          if (requireLinkedIn && !url.pathname.startsWith('/in/')) return '';
          return url.toString();
        } catch (error) {
          return '';
        }
      }

      function escapeJs(value) {
        return String(value || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      }

      function cssEscape(value) {
        if (window.CSS && CSS.escape) return CSS.escape(value);
        return String(value).replace(/[^a-zA-Z0-9_-]/g, '\\$&');
      }
    </script>
  </body>
</html>
