	<body>
		<noscript>
			<section class="noscript-card">
				<img class="brand-mark brand-image" src="/brand/finding-internships.png" width="40" height="40" alt="" aria-hidden="true" />
				<h1>Finding Internships needs JavaScript</h1>
				<p>
					This secure workspace uses JavaScript for authenticated navigation and
					data controls. You can still review the
					<a href="/privacy.html">Privacy Policy</a> and
					<a href="/terms.html">Terms of Service</a>.
				</p>
			</section>
		</noscript>
		<div id="app" class="shell" aria-live="polite">
			<section class="center-card">
				<div class="spinner" aria-hidden="true"></div>
				<p>Opening your secure career workspace…</p>
			</section>
		</div>
		<div id="toast" class="toast" role="status"></div>
		<dialog id="draft-dialog" aria-labelledby="draft-name">
			<form method="dialog" class="dialog-card" id="draft-form">
				<div class="dialog-head">
					<div>
						<p class="eyebrow">Second approval gate</p>
						<h2 id="draft-name">Review draft</h2>
					</div>
					<button class="icon-button" value="cancel" aria-label="Close dialog">×</button>
				</div>
				<input id="draft-id" type="hidden" />
				<input id="draft-version" type="hidden" />
				<label>
					Recipient email
					<input id="draft-email" type="email" autocomplete="off" />
				</label>
				<label>
					Subject
					<input id="draft-subject" maxlength="200" />
				</label>
				<label>
					Body
					<textarea id="draft-body" rows="12"></textarea>
				</label>
				<label id="resume-attachment-row" class="check-row" hidden>
					<input id="attach-resume" type="checkbox" />
					<span id="resume-attachment-label">Attach resume</span>
				</label>
				<p id="draft-audit" class="notice"></p>
				<p id="draft-role-context" class="notice" hidden></p>
				<div id="draft-context"></div>
				<p id="draft-save-state" class="notice" role="status"></p>
				<div class="actions">
					<button type="button" class="secondary" id="save-draft">Save changes</button>
					<button type="button" class="primary" id="send-draft">Approve and send</button>
				</div>
			</form>
		</dialog>
	</body>
</html>
